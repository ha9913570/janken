<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じゃんけんゲーム</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Janken GAME!</h1>

  <div>
    Hi <span sec:authentication="name"></span>
  </div>

  <div th:if="${users}">
    <p>エントリー</p>
    <ul>
      <li th:each="user : ${users}">[[${user.userName}]]</li>
    </ul>
  </div>

  <a th:href="@{/janken(hand='Gu')}">ぐー</a>
  <a th:href="@{/janken(hand='Choki')}">ちょき</a>
  <a th:href="@{/janken(hand='Pa')}">ぱー</a>

  <div th:if="${janken}">
    <p>あなたの手: [[${janken.userHand}]]</p>
    <p>相手の手: [[${janken.cpuHand}]]</p>
    <p>結果: [[${janken.result}]]</p>
  </div>
</body>

</html>
