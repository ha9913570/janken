<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じゃんけんゲーム</title>
</head>

<body>
  <h1>相手の手を待っています</h1>
  <p>Hi <span sec:authentication="name"></span></p>

  <div th:if="${match}">
    <h2>結果</h2>
    <span>
      Match: id [[${match.id}]] user1: [[${match.user1}]] user2: [[${match.user2}]] user1の手: [[${match.user1Hand}]]
      user2の手: [[${match.user2Hand}]]
    </span>
    <br />
    <a href="/janken">もどる</a>
  </div>
</body>

</html>
