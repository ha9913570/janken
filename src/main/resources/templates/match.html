<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じゃんけんゲーム</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Match</h1>
  <h2><span sec:authentication="name"></span> V.S. [[${user2.userName}]]</h2>

  <a th:href="@{/fight(id=${user2.id},hand=Gu)}">ぐー</a>
  <a th:href="@{/fight(id=${user2.id},hand=Choki)}">ちょき</a>
  <a th:href="@{/fight(id=${user2.id},hand=Pa)}">ぱー</a>

  <br />

  <div th:if="${match}">
    <p>あなたの手 [[${match.user1Hand}]]</p>
    <p>相手の手 [[${match.user2Hand}]]</p>
    <p>結果 [[${result}]]</p>
  </div>

  <a href="/janken">もどる</a>
</body>

</html>
